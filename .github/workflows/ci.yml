name: CI/CD Pipeline

on:
  push:
    branches: [ main, appointmentbooking ]
  pull_request:
    branches: [ main, appointmentbooking ]

jobs:
  backend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build Backend
      run: mvn clean package -DskipTests
      working-directory: .

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-build
        path: target/

  frontend-build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: npm install
      working-directory: frontend

    - name: Build Frontend
      run: npm run build
      working-directory: frontend

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-build
        path: frontend/build/

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Check Code Style
      run: mvn checkstyle:check
      continue-on-error: true

    - name: Run SonarQube Analysis
      run: mvn sonar:sonar -Dsonar.projectKey=AppointmentScheduling -Dsonar.host.url=http://localhost:9000
      continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'AppointmentScheduling'
        path: '.'
        format: 'JSON'
      continue-on-error: true

  build-status:
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]
    if: always()

    steps:
    - name: Check Build Status
      run: |
        if [ "${{ needs.backend-build.result }}" == "failure" ] || [ "${{ needs.frontend-build.result }}" == "failure" ]; then
          echo "❌ Build Failed"
          exit 1
        else
          echo "✅ Build Successful"
        fi
