spring.application.name=Schedular-App

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/scheduler
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Role Configuration
role.admin=ADMIN
role.user=USER

# CORS Configuration - Restrict to specific methods and headers
spring.security.cors.configurationSource.allowedOrigins=http://localhost:3000
spring.security.cors.configurationSource.allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.security.cors.configurationSource.allowedHeaders=Content-Type,Authorization
spring.security.cors.configurationSource.allowCredentials=true
spring.security.cors.configurationSource.exposedHeaders=Authorization
spring.security.cors.configurationSource.maxAge=3600

# Logging Configuration
logging.level.root=INFO
logging.level.AppointmentScheduling.Schedular_App=INFO
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

